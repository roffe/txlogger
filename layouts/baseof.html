<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:title" content="{{ if .IsHome }}txlogger{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ .Description | default site.Params.description }}">
    <meta property="og:image" content="https://txlogger.com/txlogger5.jpg">
    <title>{{ if .IsHome }}txlogger - Blazing fast data logging for Trionic 5, 7 & 8{{ else }}{{ .Title }} - txlogger{{ end }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212121;
        }

        .font-exo {
            font-family: 'Exo 2', sans-serif;
        }

        .media-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            border: 2px solid #374151;
            transition: border-color 0.3s ease-in-out;
            cursor: pointer;
        }

        .media-container:hover {
            border-color: #00b34f;
            box-shadow: 0 0 15px rgba(0, 179, 79, 0.4);
        }

        .media-container iframe,
        .media-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .saab-green {
            color: #00b34f;
        }

        .bg-saab-green {
            background-color: #00b34f;
        }

        .hover\:bg-saab-green-dark:hover {
            background-color: #009943;
        }

        .border-saab-green {
            border-color: #00b34f;
        }

        #modal {
            transition: opacity 0.3s ease;
        }

        #modal-content iframe,
        #modal-content img {
            max-width: 90vw;
            max-height: 85vh;
        }
    </style>
</head>

<body class="text-gray-300 antialiased">

    <header class="border-b border-gray-700/60">
        <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="font-exo text-xl font-bold text-white uppercase tracking-wide">tx<span
                    class="saab-green">logger</span></a>
            <div class="flex gap-6">
                <a href="/" class="hover:text-white transition-colors">Home</a>
                <a href="/docs/" class="hover:text-white transition-colors">Docs</a>
                <a href="https://github.com/roffe/txlogger" target="_blank"
                    class="hover:text-white transition-colors">GitHub</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-8 md:py-12">

        {{ block "main" . }}{{ end }}

        <br /><br />
        <section class="text-center">
            &copy; {{ now.Year }} Joakim Karlsson. All rights reserved. | <a href="/privacy_policy.html"
                class="hover:text-gray-300 transition-colors">Privacy Policy</a>
        </section>
    </main>
</body>

</html>
