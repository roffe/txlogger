# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
name: Build Windows Develop
on:
  push:
    branches:
    - 'master'
    - 'develop'
    
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            vcpkgCommitId: '74e6536215718009aae747d86d84b78376bf9e09'
    steps:
   
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26.3'
        cache: false

    - name: Install dependencies
      run: |
        go get .
        go install fyne.io/tools/cmd/fyne@latest
        .\setup_build_env.ps1

    - name: Build
      run: |
        $env:PATH += ";D:\a\txlogger\txlogger\llvm-mingw\bin"
        .\build.ps1 -cangateway -usegitsrc -txlogger -setup

    - name: Creating Zip
      run: 7z a txlogger.zip txlogger.exe cangateway.exe .\debug.bat C:\Progra~2\Kvaser\Canlib\Bin\canlib32.dll .\vcpkg\packages\libusb_x64-windows\bin\libusb-1.0.dll .\canusb\dll64\canusbdrv64.dll

    - name: Creating Setup Zip
      run: 7z a txlogger_setup.zip txlogger_setup.exe

    - name: Delete previous nightly release
      run: |
        gh release view nightly 2>$null
        if ($LASTEXITCODE -eq 0) {
          gh release delete nightly --yes --cleanup-tag
        } else {
          Write-Host "No existing nightly release to delete."
          $global:LASTEXITCODE = 0
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish nightly release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: Nightly Build
        body: Automated build from `${{ github.ref_name }}` at ${{ github.sha }}.
        prerelease: true
        make_latest: false
        target_commitish: ${{ github.sha }}
        files: |
          txlogger.zip
          txlogger_setup.zip
