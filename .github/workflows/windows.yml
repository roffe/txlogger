# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
name: Build Windows Develop
on:
  push:
    branches:
    - 'master'
    - 'develop'
    
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            vcpkgCommitId: '74e6536215718009aae747d86d84b78376bf9e09'
    steps:
   
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.1
      with:
        nsis-version: '3.11'

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26.4'
        cache: false

    - name: Install dependencies
      run: |
        go get .
        go install fyne.io/tools/cmd/fyne@latest

    #- name: Install CANUSB SDK
    #  run: |
    #    New-Item -ItemType Directory -Path .\canusb -Force | Out-Null
    #    Invoke-WebRequest -Uri "https://www.canusb.com/files/canusb_dll_driver.zip" -OutFile canusb_dll_driver.zip
    #    Expand-Archive -Path canusb_dll_driver.zip -DestinationPath .\canusb -Force

    - name: Install CANLIB
      run: |
        Invoke-WebRequest -Uri "https://pim.kvaser.com/var/assets/Product_Resources/7330130980150/5.51.461/canlib_5_51_461.exe" -OutFile canlib.exe
        Start-Process -FilePath .\canlib.exe -ArgumentList "/S" -Wait

    - name: Install llvm-mingw
      run: |
        Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/llvm-mingw-20251216-ucrt-x86_64.zip" -OutFile llvm-mingw.zip
        Expand-Archive -Path llvm-mingw.zip -DestinationPath .\ -Force
        Rename-Item -Path .\llvm-mingw-20251216-ucrt-x86_64 -NewName llvm-mingw

    - name: Install libusb via vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git --depth=1
        .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        .\vcpkg\vcpkg.exe install libusb:x64-windows

    - name: Build
      run: |
        $env:PATH += ";D:\a\txlogger\txlogger\llvm-mingw\bin"
        .\build.ps1 -j2534proxy -txlogger -setup

    - name: Creating Zip
      run: 7z a txlogger.zip txlogger.exe j2534proxy.exe .\debug.bat C:\Progra~2\Kvaser\Canlib\bin_x64\canlib32.dll .\vcpkg\packages\libusb_x64-windows\bin\libusb-1.0.dll .\dist\canusbdrv64.dll

    - name: Creating Setup Zip
      run: 7z a txlogger_setup.zip txlogger_setup.exe

    # DirectX build last: it overwrites txlogger.exe, both zips above are already made
    - name: Build DirectX
      run: |
        $env:PATH += ";D:\a\txlogger\txlogger\llvm-mingw\bin"
        .\build.ps1 -txlogger -setup -directx

    - name: Creating DirectX Zips
      run: |
        7z a txlogger_directx.zip txlogger.exe j2534proxy.exe .\debug.bat C:\Progra~2\Kvaser\Canlib\bin_x64\canlib32.dll .\vcpkg\packages\libusb_x64-windows\bin\libusb-1.0.dll .\dist\canusbdrv64.dll
        Rename-Item txlogger_setup.exe txlogger_directx_setup.exe
        7z a txlogger_directx_setup.zip txlogger_directx_setup.exe

    - name: Delete previous nightly release
      run: |
        gh release view nightly 2>$null
        if ($LASTEXITCODE -eq 0) {
          gh release delete nightly --yes --cleanup-tag
        } else {
          Write-Host "No existing nightly release to delete."
          $global:LASTEXITCODE = 0
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish nightly release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: Nightly Build
        body: Automated build from `${{ github.ref_name }}` at ${{ github.sha }}.
        prerelease: true
        make_latest: false
        target_commitish: ${{ github.sha }}
        files: |
          txlogger.zip
          txlogger_setup.zip
          txlogger_directx.zip
          txlogger_directx_setup.zip
